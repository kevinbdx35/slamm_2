[build]
  command = "npm run build"
  publish = "dist"

# Les en-têtes de sécurité (CSP, HSTS, etc.) sont définis dans `public/_headers`
# (source unique). Ne pas les dupliquer ici pour éviter les conflits.

[[redirects]]
  from = "/cours"
  to = "/disciplines"
  status = 301

[[redirects]]
  from = "/cours/"
  to = "/disciplines"
  status = 301

# Catch-all 404. ATTENTION : ne JAMAIS ajouter `force = true` sur cette règle.
# Sans `force`, Netlify sert d'abord les fichiers réels de `dist/` et n'applique
# cette règle qu'en dernier recours. Avec `force = true`, elle masquerait tous les
# fichiers servis en direct, dont `public/google40382428cf17f542.html` qui conditionne
# la validation Google Search Console (voir README § Google Search Console).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
