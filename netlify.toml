[build]
  command = "npm run build"
  publish = "dist"

# Les en-têtes de sécurité (CSP, HSTS, etc.) sont définis dans `public/_headers`
# (source unique). Ne pas les dupliquer ici pour éviter les conflits.

[[redirects]]
  from = "/cours"
  to = "/disciplines"
  status = 301

[[redirects]]
  from = "/cours/"
  to = "/disciplines"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
