[build]
  command = "npm run build"
  publish = "dist"

# En-têtes de sécurité appliqués à toutes les réponses.
# Note : 'unsafe-inline' est requis pour script-src/style-src car Astro génère
# des scripts inline (hydratation) et le site utilise des attributs style= inline
# (ex. Schedule). Le risque XSS reste faible : site statique, aucune donnée
# utilisateur n'est réinjectée dans le HTML.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com https://img.youtube.com https://i.ytimg.com; font-src 'self'; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"

[[redirects]]
  from = "/cours"
  to = "/disciplines"
  status = 301

[[redirects]]
  from = "/cours/"
  to = "/disciplines"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
