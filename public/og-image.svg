<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#080f0a"/>

  <!-- Dot grid -->
  <defs>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(34,197,94,0.2)"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask">
      <rect width="1200" height="630" fill="url(#fade)"/>
    </mask>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dots)" mask="url(#dotmask)"/>
  <ellipse cx="200" cy="150" rx="400" ry="400" fill="url(#orb1)"/>
  <ellipse cx="1050" cy="500" rx="300" ry="300" fill="url(#orb2)"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="56" height="56" rx="10" fill="#16a34a"/>
  <text x="108" y="120" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">SL</text>

  <!-- Club name -->
  <text x="152" y="104" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#bbf7d0" letter-spacing="1">SAINT-LUNAIRE</text>
  <text x="152" y="124" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4ade80" letter-spacing="1">ARTS MARTIAUX MIXTES</text>

  <!-- Main title -->
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#f0fdf4" letter-spacing="-3">L'art du</text>
  <text x="80" y="405" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#4ade80" letter-spacing="-3">combat.</text>

  <!-- Subtitle -->
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#93c9a4">Club MMA à Saint-Lunaire · Côte d'Émeraude · Bretagne</text>

  <!-- URL -->
  <text x="80" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#7aaa8a">mma-saint-lunaire.fr</text>

  <!-- Badge -->
  <rect x="920" y="520" width="200" height="36" rx="18" fill="#22c55e"/>
  <text x="1020" y="544" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#080f0a" text-anchor="middle">Cours d'essai gratuit</text>
</svg>
