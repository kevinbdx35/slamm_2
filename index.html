<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" />
    <title>SLAMM - MMA Saint-Lunaire</title>
    <!-- Google Search Console -->
    <meta name="google-site-verification" content="zGMsPo4XH7j4MTW55xPOQGI6EBbWk1dn1J01LZchXGM" />
    <!-- Preload de l'image LCP pour améliorer les performances -->
    <link rel="preload" href="/img/team/photo1_scale,w_1400.webp" as="image">
    <!-- Polices chargées via @fontsource dans main.jsx avec font-display: swap -->
    <style>
      /* Safe Area Support pour iOS */
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      
      /* Global Safe Area */
      html, body {
        padding: 0;
        margin: 0;
        /* Padding pour les safe areas */
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }
      
      /* Font-display swap pour éviter FOIT */
      @font-face {
        font-family: 'IBM Plex Mono';
        font-display: swap;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
